@defer (when searchOpen(); prefetch on idle) {
  @if (searchOpen()) {
    <app-search-modal [returnFocusTarget]="returnFocusTarget()" (closed)="searchOpen.set(false)" />
  }
} @loading {
  <div class="search-loading" role="status">Loading search…</div>
} @error {
  <div class="search-loading" role="alert">Search could not load. Please reload and try again.</div>
}
