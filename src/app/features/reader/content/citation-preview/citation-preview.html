<article class="citation-card" role="dialog" aria-label="Citation preview">
  <header class="citation-card-header">
    <span>Reference</span>
    <button
      type="button"
      class="citation-card-close"
      aria-label="Close citation preview"
      title="Close"
      (click)="closeRequested.emit(true)"
    >
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  </header>

  <div class="citation-card-entry">
    @if (title(); as citationTitle) {
      @if (paperUrl(); as url) {
        <a class="citation-card-title" [href]="url" target="_blank" rel="noopener noreferrer">
          {{ citationTitle }}
        </a>
      } @else {
        <div class="citation-card-title">{{ citationTitle }}</div>
      }
      @if (authors() || year()) {
        <div class="citation-card-meta">
          {{ authors() }}@if (authors() && year()) { · }{{ year() }}
        </div>
      }
    } @else {
      <div [innerHTML]="entryHtml()"></div>
    }
  </div>

</article>
