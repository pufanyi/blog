<dialog
  #dialog
  class="search-backdrop"
  aria-label="Search posts"
  (cancel)="onCancel($event)"
  (close)="close()"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <div class="search-dialog" cdkTrapFocus>
    <div class="search-input-wrap">
      <i class="ph ph-magnifying-glass search-icon"></i>
      <input
        #searchInput
        type="text"
        placeholder="Search posts…"
        [value]="query()"
        (input)="onInput($event)"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="search-results"
        [attr.aria-expanded]="results().length > 0"
        [attr.aria-activedescendant]="results().length ? 'search-result-' + activeIndex() : null"
        aria-label="Search"
      />
      <kbd>ESC</kbd>
      <button class="search-close-btn" type="button" (click)="close()" aria-label="Close search">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </div>

    <div id="search-results" role="listbox" aria-label="Search results" class="search-results">
      @if (query() && results().length === 0) {
        <div class="search-empty">No results for "{{ query() }}"</div>
      } @else if (!query()) {
        <div class="search-empty">Type to search posts</div>
      } @else {
        @for (result of results(); track result.slug; let i = $index) {
          <button
            type="button"
            role="option"
            tabindex="-1"
            [id]="'search-result-' + i"
            [attr.aria-selected]="i === activeIndex()"
            class="search-result-item"
            [class.active]="i === activeIndex()"
            (click)="goTo(result)"
            (mouseenter)="activeIndex.set(i)"
          >
            <div class="result-title">{{ result.title }}</div>
            <div class="result-meta">
              <span class="result-date">{{ result.date }}</span>
              <span class="result-match-tag">{{ matchLabel(result.matchField) }}</span>
            </div>
            <div class="result-snippet">{{ result.snippet }}</div>
          </button>
        }
      }
    </div>
  </div>
</dialog>
