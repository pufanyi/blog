@if (items().length) {
  <span class="post-outline-anchor" #outlineAnchor aria-hidden="true"></span>
  <aside class="post-toc-sidebar" #sidebar [class.is-pinned]="outlinePinned()">
    <app-post-toc
      idPrefix="sidebar-toc"
      [collapsible]="true"
      [items]="items()"
      [postPath]="postPath()"
      [activeHeadingId]="activeHeadingId()"
      [progress]="readingProgress()"
      (sectionSelected)="onTocNavigate($event)"
    />
  </aside>

  <button class="post-contents-dock" type="button" (click)="toggleToc()"
    aria-label="Open table of contents" aria-controls="post-toc-dialog"
    [attr.aria-expanded]="tocOpen()">
    <span class="contents-dock-label"><i class="ph ph-list" aria-hidden="true"></i> Contents</span>
    <span class="contents-dock-context">{{ currentSection() || items().length + ' chapters' }}</span>
    <i class="ph ph-caret-up" aria-hidden="true"></i>
  </button>

  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -- native dialog keyboard interaction is handled by the browser -->
  <dialog
    class="post-toc-dialog"
    id="post-toc-dialog"
    #tocDialog
    tabindex="-1"
    aria-label="Table of contents"
    (click)="onTocDialogClick($event)"
    (close)="onTocDialogClose()"
  >
    <div class="toc-drawer">
      <button
        class="toc-drawer-close"
        type="button"
        autofocus
        aria-label="Close table of contents"
        title="Close table of contents"
        (click)="closeToc()"
      >
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>

      <app-post-toc
        idPrefix="dialog-toc"
        [items]="items()"
        [postPath]="postPath()"
        [activeHeadingId]="activeHeadingId()"
        [progress]="readingProgress()"
        (sectionSelected)="onTocNavigate($event)"
      />
    </div>
  </dialog>
}
