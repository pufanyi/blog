<header class="toolbar">
  <div class="toolbar-inner">
    <nav class="toolbar-group toolbar-nav" aria-label="Main navigation">
      <a class="toolbar-button toolbar-brand" routerLink="/" routerLinkActive="is-current"
        [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" aria-label="Home" title="Home">
        <img class="toolbar-avatar" [ngSrc]="authorAvatar" alt="" width="32" height="32" priority>
        <span class="toolbar-label">{{ authorName }}</span>
      </a>
      <a class="toolbar-button" routerLink="/blog" routerLinkActive="is-current"
        ariaCurrentWhenActive="location" aria-label="Blog" title="Blog">
        <i class="ph ph-notebook" aria-hidden="true"></i>
        <span class="toolbar-label">Blog</span>
      </a>
    </nav>
    @for (btn of chrome.actions(); track btn.ariaLabel) {
      <button class="toolbar-button toolbar-context-action" type="button" #contextAction (click)="btn.action(contextAction)"
        [attr.aria-label]="btn.ariaLabel" [attr.aria-controls]="btn.ariaControls ?? null"
        [attr.aria-expanded]="btn.isExpanded ? btn.isExpanded() : null" [title]="btn.title">
        @if (btn.toggleIcon && btn.isToggled?.()) {
          <i [class]="'ph ' + btn.toggleIcon" aria-hidden="true"></i>
        } @else {
          <i [class]="'ph ' + btn.icon" aria-hidden="true"></i>
        }
      </button>
    }
    <span class="toolbar-context">{{ chrome.title() }}</span>
    <div class="toolbar-group toolbar-actions">
      <button class="toolbar-button toolbar-search" type="button" #searchTrigger (click)="search.open(searchTrigger)"
        aria-label="Search" title="Search posts (Ctrl+K / ⌘K)">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <span class="toolbar-label">Search</span>
        <kbd aria-hidden="true">⌘ / Ctrl K</kbd>
      </button>
      <button class="toolbar-button" type="button" (click)="print()" aria-label="Print" title="Export as PDF / Print">
        <i class="ph ph-printer" aria-hidden="true"></i>
      </button>
      <button class="toolbar-button" type="button" (click)="themeService.toggle()" aria-label="Toggle theme" title="Toggle light/dark theme">
        @if (themeService.theme() === 'light') {
          <i class="ph ph-moon" aria-hidden="true"></i>
        } @else {
          <i class="ph ph-sun" aria-hidden="true"></i>
        }
      </button>
    </div>
  </div>
</header>

<app-search-launcher #search />
