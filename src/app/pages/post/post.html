@if (post(); as post) {
  @if (tocItems().length) {
    <aside class="post-toc-sidebar">
      <app-post-toc
        [items]="tocItems()"
        [activeHeadingId]="activeHeadingId()"
        [progress]="readingProgress()"
        (sectionSelected)="onTocNavigate($event)"
      />
    </aside>

    <button
      class="toc-toggle"
      type="button"
      (click)="toggleToc()"
      [attr.aria-expanded]="tocOpen()"
      aria-controls="post-toc-dialog"
      aria-label="Toggle table of contents"
      title="Table of Contents"
    >
      @if (tocOpen()) {
        <i class="ph ph-x" aria-hidden="true" style="font-size: 20px"></i>
      } @else {
        <i class="ph ph-list" aria-hidden="true" style="font-size: 20px"></i>
      }
    </button>

    <dialog
      class="post-toc-dialog"
      id="post-toc-dialog"
      #tocDialog
      aria-label="Table of contents"
      (click)="onTocDialogClick($event)"
      (close)="onTocDialogClose()"
    >
      <div class="toc-drawer">
        <button
          class="toc-drawer-close"
          type="button"
          autofocus
          aria-label="Close table of contents"
          title="Close table of contents"
          (click)="closeToc()"
        >
          <i class="ph ph-x" aria-hidden="true"></i>
        </button>

        <app-post-toc
          [items]="tocItems()"
          [activeHeadingId]="activeHeadingId()"
          [progress]="readingProgress()"
          (sectionSelected)="onTocNavigate($event)"
        />
      </div>
    </dialog>
  }

  <app-post-header [title]="post.title" [date]="post.date" [coverImage]="post.coverImage" />

  <article class="post-body" #postBody [innerHTML]="safeHtml()"></article>

  <section class="giscus-wrapper">
    <app-giscus-comments />
  </section>

  <app-back-to-top />
} @else {
  <div class="not-found">
    <h1>Post not found</h1>
    <a routerLink="/blog"><i class="ph ph-arrow-left" aria-hidden="true"></i> Back to all posts</a>
  </div>
}
