<router-outlet />
@if (loading()) {
  <div class="navigation-progress" aria-hidden="true"></div>
}
@if (failedUrl(); as url) {
  <div class="navigation-feedback" role="status" aria-live="polite" aria-atomic="true">
    <span class="navigation-message">
      Page failed to load. <a [href]="url">Try again</a>
      <button type="button" (click)="failedUrl.set(null)" aria-label="Dismiss loading error">×</button>
    </span>
  </div>
}
