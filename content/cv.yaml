  - title: Publications & Research
    entries:
      - title: "LMMs-Engine: A Simple, Unified Multimodal Models Training Engine"
        date: Aug 2025 – Present
        detail: "Research Project, Core Developer"
        links:
          - text: GitHub
            href: "https://github.com/EvolvingLMMs-Lab/lmms-engine"
        items:
          - A lean and flexible training framework designed for both rapid research prototyping and large-scale production
          - Optimized the Bagel training pipeline by integrating FSDP2 and Liger Kernel for efficient distributed training
          - Designing asynchronous reinforcement-learning infrastructure for the project

      - title: "LMMs-Eval: Reality Check on the Evaluation of Large Multimodal Models"
        date: Jan 2024 – Present
        detail: "NAACL 2025 (Findings), Co-first author"
        links:
          - text: Paper
            href: "https://arxiv.org/abs/2407.12772"
          - text: Project Page
            href: "https://lmms-lab.github.io/lmms-eval-blog/lmms-eval-0.1/"
        items:
          - "An open-source multimodal evaluation framework with <strong>4.3K GitHub stars</strong>"
          - >-
            Built the evaluation pipeline and developed a low-cost automatic data-generation pipeline for
            Multi-modal LiveBench, which leverages continuously updated news and online forums to evaluate
            models' generalization in the wild

      - title: "Mage-Flow: An Efficient Native-Resolution Foundation Model for Image Generation and Editing"
        date: Jan 2026 – Apr 2026
        detail: "Technical Report (Microsoft Research), Contributor"
        links:
          - text: Paper
            href: "https://arxiv.org/abs/2607.19064"
          - text: Project Page
            href: "https://microsoft.github.io/Mage/flow/"
        items:
          - An efficient native-resolution foundation model for high-quality image generation and editing
          - >-
            Extended LMMs-Engine for Mage-Flow pre-training by integrating FSDP2, Liger Kernel, and sequence
            packing, enabling efficient native multi-resolution training across heterogeneous image resolutions
            and aspect ratios

      - title: Demystifying Video Reasoning
        date: Jan 2026 – Mar 2026
        detail: "ECCV 2026, Third Author"
        links:
          - text: Paper
            href: "https://arxiv.org/abs/2603.16870"
          - text: Project Page
            href: "https://www.wruisi.com/demystifying_video_reasoning/"
        items:
          - Revisited video reasoning and proposed Chain-of-Step, in which models reason through diffusion steps
          - Curated a large collection of examples to validate this hypothesis and systematically analyzed models' reasoning behaviors

      - title: "SenseNova-SI: Scaling Spatial Intelligence with Multimodal Foundation Models"
        date: Sep 2025 – Jan 2026
        detail: "CVPR 2026, Co-first author"
        links:
          - text: Paper
            href: "https://openaccess.thecvf.com/content/CVPR2026/papers/Cai_Scaling_Spatial_Intelligence_with_Multimodal_Foundation_Models_CVPR_2026_paper.pdf"
          - text: GitHub
            href: "https://github.com/OpenSenseNova/SenseNova-SI"
        items:
          - Developed a foundation model for scaling spatial intelligence, achieving state-of-the-art performance on key spatial benchmarks
          - >-
            Conducted rigorous ablation studies to establish that spatial intelligence is primarily driven by data
            scaling rather than reasoning heuristics (CoT), guiding the project's strategic focus on constructing
            the SenseNova-SI-8M dataset
          - Executed the full-stack training pipeline for Qwen-based variants with LMMs-Engine on 128 GPUs

      - title: "Video-MMMU: Evaluating Knowledge Acquisition from Multi-Discipline Professional Videos"
        date: Sep 2024 – Feb 2025
        detail: "ACL 2026, Third Author"
        links:
          - text: Paper
            href: "https://arxiv.org/abs/2410.13764"
          - text: Project Page
            href: "https://video-mmmu.github.io/"
        items:
          - >-
            Built an evaluation set with 300 expert-level videos and 900 human-annotated questions across six
            disciplines, cited by <a href="https://deepmind.google/models/gemini/pro/" target="_blank">Gemini 3 Pro</a>
            (Google) and <a href="https://openai.com/index/introducing-gpt-5/" target="_blank">GPT-5</a> (OpenAI)
          - >-
            Proposed a knowledge-gain metric to quantify performance improvements after watching video lectures;
            validated expert-level data in economics and medicine to ensure benchmark quality

      - title: "Multi-Modal In-Context Instruction Tuning (Otter, MIMIC-IT)"
        date: Jun 2023 – Dec 2023
        detail: "IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI), Co-first author"
        links:
          - text: Paper
            href: "https://arxiv.org/abs/2306.05425"
          - text: Project Page
            href: "https://github.com/Luodian/Otter"
        items:
          - "Developed an early vision-language-agent (VLA) model with <strong>3.3K GitHub stars</strong>"
          - >-
            Developed a language-model-based pipeline that generated 2.8M multimodal instruction-tuning samples;
            created an evaluation framework that later evolved into LMMs-Eval

