abstract:
  paragraphs:
    - >-
      I am currently a final-year undergraduate student at
      <a href="https://www.ntu.edu.sg/" target="_blank">Nanyang Technological University</a>,
      specializing in <a href="https://www.ntu.edu.sg/education/undergraduate-programme/bachelor-of-science-in-data-science-artificial-intelligence"
      target="_blank">Data Science and Artificial Intelligence</a>.
    - >-
      I am currently conducting research at <a href="https://www.sensetime.com/en"
      target="_blank">SenseTime</a> and <a href="https://www.mmlab-ntu.com/"
      target="_blank">MMLab@NTU</a>. I am fortunate to be supervised by
      <a href="https://liuziwei7.github.io/" target="_blank">Prof. Ziwei Liu</a>, I am also
      grateful for the extensive help I have received from <a href="https://brianboli.com/"
      target="_blank">Bo Li</a>, <a href="https://caizhongang.com/" target="_blank">Zhongang Cai</a>
      and <a href="https://scholar.google.com/citations?user=jZH2IPYAAAAJ"
      target="_blank">Lei Yang</a>. My research interests center on multimodal models.
    - >-
      During my time at <a href="http://www.sxyz.net/" target="_blank">Shaoxing No.1 High School</a>,
      I participated in the <a href="https://www.noi.cn/" target="_blank">Olympiad in Informatics</a>.
      After graduating, I spent a rewarding year at the
      <a href="https://drise.dlut.edu.cn/" target="_blank">School of International Information and Software</a>
      at <a href="https://www.dlut.edu.cn/" target="_blank">Dalian University of Technology</a>.
      Amid the disruption caused by the COVID-19 pandemic, I chose to withdraw and begin
      my undergraduate studies anew at Nanyang Technological University.
    - >-
      During my studies at Dalian University of Technology and Nanyang Technological University, I competed in the
      <a href="https://icpc.global/" target="_blank">ICPC</a>. I also contribute to the
      <a href="https://ntu-icpc.github.io/npc/" target="_blank">Nanyang Programming Contest</a>.
      I am deeply grateful to <a href="/icpc">my teammates and friends</a>
      for their support throughout this journey! 🙏
    - >-
      I enjoy playing chess. My Lichess username is <a href="https://lichess.org/@/pufanyi"
      target="_blank">@pufanyi</a>, and my current rapid rating is 2086.

