<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img" aria-labelledby="title desc">
<title id="title">Cover a triangle using a diagonal strip</title><desc id="desc">Every point in the target triangle lies between two lines of constant coordinate sum.</desc>
<defs><style>
.title{font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172F3D}
.subtitle{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#617483}
.label{font:italic 16px Georgia,"Times New Roman",serif;fill:#234254}
.note{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#234254}
.legend{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4A6070}
</style><clipPath id="plot"><rect x="98" y="82" width="552" height="308"/></clipPath>
<clipPath id="strip"><path d="M98 82 H228 L536 390 H378 L98 110 Z"/></clipPath>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#526A79" stroke-width="1.3"/></marker>
</defs>
<rect width="760" height="468" rx="18" fill="#FFFFFF"/>
<text x="34" y="39" class="title">Cover a triangle using a diagonal strip</text><text x="34" y="62" class="subtitle">Every point in the target triangle lies between two lines of constant coordinate sum.</text>
<rect x="98" y="82" width="552" height="308" rx="4" fill="#FAFCFD" stroke="#E4EBEF"/>
<g clip-path="url(#plot)"><g stroke="#EAF0F2" stroke-width="1"><path d="M138 82V390 M178 82V390 M218 82V390 M258 82V390 M298 82V390 M338 82V390 M378 82V390 M418 82V390 M458 82V390 M498 82V390 M538 82V390 M578 82V390 M618 82V390"/><path d="M98 110H650 M98 150H650 M98 190H650 M98 230H650 M98 270H650 M98 310H650 M98 350H650"/></g>
<path d="M98 82 H228 L536 390 H378 L98 110 Z" fill="#DBF3EF"/>

<path d="M280 292 L438 292 L280 134 Z" fill="#46B7AD" opacity=".84"/>
<path d="M98 110 L378 390 M228 82 L536 390" fill="none" stroke="#D28B4F" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M280 134 V292 H438" fill="none" stroke="#16766E" stroke-width="3" stroke-linejoin="round"/>
<path d="M280 134 L438 292" fill="none" stroke="#16766E" stroke-width="2.7"/>
</g>
<path d="M82 390 H674" fill="none" stroke="#526A79" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M98 406 V74" fill="none" stroke="#526A79" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="682" y="396" class="label">x′</text><text x="78" y="72" class="label">y′</text>
<circle cx="280" cy="292" r="4.2" fill="#134F4B"/><circle cx="280" cy="134" r="3" fill="#134F4B"/><circle cx="438" cy="292" r="3" fill="#134F4B"/>
<text x="287" y="311" class="label">(x, y)</text>
<text x="285" y="128" class="label">(x, y + l)</text>
<text x="442" y="284" class="label">(x + l, y)</text>
<text x="478" y="371" class="label" transform="rotate(45 478 371)">x′ + y′ = x + y + l</text>
<text x="124" y="155" class="label" transform="rotate(45 124 155)">x′ + y′ = x + y</text>

<rect x="245" y="418" width="13" height="13" rx="3" fill="#46B7AD"/><text x="265" y="429" class="legend">Target triangle</text>
<rect x="432" y="418" width="13" height="13" rx="3" fill="#DBF3EF" stroke="#4D9B94"/><text x="452" y="429" class="legend">Diagonal strip</text>
</svg>