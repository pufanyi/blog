name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate derived content
        run: pnpm generate:data

      - name: Run code quality checks
        run: pnpm check:generated

      - name: Run unit tests
        run: pnpm test:generated --watch=false

  check:
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    permissions:
      contents: read

    steps:
      - name: Require all quality checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
