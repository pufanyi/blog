name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate derived content
        run: pnpm generate:data

      - name: Run code quality checks
        run: pnpm check:generated

      - name: Run unit tests
        run: pnpm test:generated --watch=false

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Build production site
        run: pnpm build

      - name: Run browser tests
        run: pnpm exec playwright test

      - name: Upload resource and rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-resource-and-rendering-evidence
          path: |
            test-results/**/resources.json
            test-results/**/made-*.png
            test-results/**/wide-formula.png
            test-results/**/docs-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  check:
    if: always()
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    permissions:
      contents: read

    steps:
      - name: Require all quality checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$QUALITY_RESULT" = success && test "$BROWSER_RESULT" = success
