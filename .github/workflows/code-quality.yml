name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2

      - name: Run Biome lint and format check
        run: biome ci .

  check:
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    permissions:
      contents: read

    steps:
      - name: Require all quality checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
